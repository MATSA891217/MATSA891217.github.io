<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>{{ page.title | default: site.title }}</title>
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  
  <style>
    body {
      background-image: url('https://MATSA891217.github.io/assets/images/wallpaper.jpg') !important;
      background-size: cover !important;
      background-attachment: fixed !important;
      background-position: center !important;
    }

    .container {
      display: flex;
      gap: 30px;
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
    }

    .main-content {
      flex: 1;
    }

    .wrapper {
      background: rgba(0, 0, 0, 0.7) !important;
      padding: 30px !important;
      border-radius: 8px !important;
    }

    .header-row {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-bottom: 30px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 20px;
    }

    .avatar {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .site-title {
      color: #d4c9a8;
      font-size: 28px;
      margin: 0;
      letter-spacing: 2px;
      font-weight: normal;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="main-content">
      <div class="header-row">
        < img src="/assets/images/square.png" class="avatar" alt="avatar">
        <h1 class="site-title">{{ site.title | default: "我的博客" }}</h1>
      </div>
      {{ content }}
    </div>
  </div>
</body>
</html>
