<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>{{ page.title | default: site.title }}</title>
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  
  <style>
    body {
      background-image: url('https://MATSA891217.github.io/assets/images/wallpaper.jpg') !important;
      background-size: cover !important;
      background-attachment: fixed !important;
      background-position: center !important;
    }

    .container {
      display: flex;
      gap: 30px;
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
    }

    .main-content {
      flex: 1;
    }

    .wrapper {
      background: rgba(0, 0, 0, 0.7) !important;
      padding: 30px !important;
      border-radius: 8px !important;
    }

    .header-row {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-bottom: 30px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 20px;
    }

    .avatar {
      width: 120px;
      height: 120px;
      border-radius: 20%;
      flex-shrink: 0;
      border: 3px solid #00aaff;
      box-shadow: 0 0 20px rgba(0, 170, 255, 0.3);
    }

    .site-title {
      font-family: 'Courier New', monospace;
      font-weight: 900;
      font-size: 36px;
      color: #0066cc;
      text-shadow: 
        2px 2px 0 #003366,
        0 0 20px rgba(0, 100, 255, 0.5);
      margin: 0;
      letter-spacing: 2px;
    }

    .slogan {
      text-align: center;
      font-size: 24px;
      font-weight: bold;
      color: #ff00ff;
      text-shadow: 
        0 0 10px #ff00ff,
        0 0 20px #ff00ff,
        0 0 40px #00ffff,
        0 0 80px #00ffff;
      animation: neonPulse 1.5s ease-in-out infinite alternate;
      margin-top: 10px;
    }

    @keyframes neonPulse {
      0% {
        text-shadow: 
          0 0 5px #ff00ff,
          0 0 10px #ff00ff,
          0 0 20px #00ffff;
        transform: scale(1);
      }
      100% {
        text-shadow: 
          0 0 15px #ff00ff,
          0 0 30px #ff00ff,
          0 0 60px #00ffff,
          0 0 100px #00ffff;
        transform: scale(1.05);
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="main-content">
      <div class="header-row">
        < img src="/assets/images/square.png" class="avatar" alt="avatar">
        <div>
          <h1 class="site-title">{{ site.title | default: "MATSA891217" }}</h1>
          <div class="slogan">✨ HELLO MY BLOG ✨</div>
        </div>
      </div>
      {{ content }}
    </div>
  </div>
</body>
</html>
