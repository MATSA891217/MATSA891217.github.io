<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>{{ page.title | default: site.title }}</title>
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  
  <style>
    body {
      background-image: url('https://MATSA891217.github.io/assets/images/wallpaper.jpg') !important;
      background-size: cover !important;
      background-attachment: fixed !important;
      background-position: center !important;
    }

    .container {
      display: flex;
      gap: 30px;
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
    }

    .main-content {
      flex: 1;
    }

    .wrapper {
      background: rgba(0, 0, 0, 0.7) !important;
      padding: 30px !important;
      border-radius: 8px !important;
    }

    .header-row {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-bottom: 30px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 20px;
    }

    .avatar {
      width: 120px;
      height: 120px;
      border-radius: 20%;
      flex-shrink: 0;
      border: 3px solid #00aaff;
      box-shadow: 0 0 20px rgba(0, 170, 255, 0.3);
    }

    .site-title {
      font-family: 'Courier New', monospace;
      font-weight: 900;
      font-size: 36px;
      color: #0066cc;
      text-shadow: 
        2px 2px 0 #003366,
        0 0 20px rgba(0, 100, 255, 0.5);
      margin: 0;
      letter-spacing: 2px;
    }

    .slogan {
      text-align: center;
      font-size: 24px;
      font-weight: bold;
      color: #ff00ff;
      text-shadow: 
        0 0 10px #ff00ff,
        0 0 20px #ff00ff,
        0 0 40px #00ffff,
        0 0 80px #00ffff;
      animation: neonPulse 1.5s ease-in-out infinite alternate;
      margin-top: 10px;
    }

    @keyframes neonPulse {
      0% {
        text-shadow: 
          0 0 5px #ff00ff,
          0 0 10px #ff00ff,
          0 0 20px #00ffff;
        transform: scale(1);
      }
      100% {
        text-shadow: 
          0 0 15px #ff00ff,
          0 0 30px #ff00ff,
          0 0 60px #00ffff,
          0 0 100px #00ffff;
        transform: scale(1.05);
      }
    }

    /* ===== 日期颜色 ===== */
    .post-meta {
      color: #0C5ECE !important;
      font-size: 14px;
      margin: 6px 0 12px 0;
    }

    /* ===== 文章标题 - 古早iPhone按键 ===== */
    .post-preview h2 {
      background: #FFBAD4;
      padding: 10px 20px;
      border-radius: 12px;
      display: inline-block;
      box-shadow: 
        inset 0 -4px 0 #d69ab0,
        inset 0 0 0 1px #f0a8c0,
        0 2px 8px rgba(0, 0, 0, 0.15);
      transition: all 0.15s ease;
      border: none;
    }

    .post-preview h2:active {
      transform: scale(0.96);
      box-shadow: 
        inset 0 -2px 0 #d69ab0,
        inset 0 0 0 1px #f0a8c0,
        0 1px 4px rgba(0, 0, 0, 0.1);
    }

    .post-preview h2 a {
      color: #B32D8B !important;
      text-decoration: none;
      font-size: 22px;
      display: block;
    }

    /* ===== 磨砂玻璃底板 ===== */
    .post-card {
      background: rgba(147, 227, 253, 0.25);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-radius: 16px;
      padding: 20px 25px;
      margin-bottom: 30px;
      border: 1px solid rgba(147, 227, 253, 0.3);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
      transition: all 0.3s ease;
    }

    .post-card:hover {
      background: rgba(147, 227, 253, 0.35);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.3);
      transform: translateY(-3px);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="main-content">
      <div class="header-row">
        <img src="/assets/images/square.png" class="avatar" alt="avatar">
        <div>
          <h1 class="site-title">{{ site.title | default: "MATSA891217" }}</h1>
          <div class="slogan">✨ HELLO MY BLOG ✨</div>
        </div>
      </div>
      {{ content }}
    </div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", function() {
      var contents = document.querySelectorAll('.post-content');
      contents.forEach(function(container) {
        var walker = document.createTreeWalker(container, NodeFilter.SHOW_TEXT, null, false);
        var nodes = [];
        while (walker.nextNode()) nodes.push(walker.currentNode);
        
        nodes.forEach(function(node) {
          var words = node.textContent.split(/(\s+)/);
          var fragment = document.createDocumentFragment();
          words.forEach(function(word) {
            var span = document.createElement('span');
            span.textContent = word;
            if (word.trim().length > 0) {
              var colors = ['#E22400', '#0056D6', '#F5EC00', '#000000'];
              var randomColor = colors[Math.floor(Math.random() * colors.length)];
              span.style.color = randomColor;
            }
            fragment.appendChild(span);
          });
          node.parentNode.replaceChild(fragment, node);
        });
      });
    });
  </script>
</body>
</html>
